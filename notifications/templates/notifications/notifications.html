<!DOCTYPE html>
<html>
<head>
<title>Notifications</title>
</head>

<body>

<h2>Your Notifications</h2>

<ul>

{% for notification in notifications %}

<li>
{{ notification.message }}
<br>
<small>{{ notification.created_at }}</small>
</li>

{% empty %}

<li>No notifications yet</li>

{% endfor %}

</ul>

</body>
</html>
