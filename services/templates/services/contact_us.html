<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - KHASIS EXPRESS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h3>Contact Us</h3>

    <!-- Contact form -->
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Send Message</button>
    </form>

    <a href="/" class="btn btn-secondary mt-3">Back Home</a>

    <!-- Direct contact -->
    <div class="mt-4">
        <h5>Or contact us directly:</h5>

        <!-- Call -->
        <a href="tel:+2347088947306" class="btn btn-success w-100 mb-2">
            Call Us
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/2347088947306?text=Hello%20KHASIS%20EXPRESS" 
           target="_blank" class="btn btn-success w-100">
            Chat on WhatsApp
        </a>
    </div>
</div>

<!-- Floating WhatsApp Button (always visible) -->
<a href="https://wa.me/2347088947306?text=Hello%20KHASIS%20EXPRESS" target="_blank" 
   style="position:fixed;bottom:20px;right:20px;z-index:1000;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" 
         alt="WhatsApp" style="width:60px;height:60px;">
</a>

</body>
</html>
