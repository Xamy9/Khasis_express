<!DOCTYPE html>
<html>
<head>
    <title>{{ service_type|title }} Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">
<div class="card shadow p-4 mx-auto" style="max-width:500px;">

<h3 class="mb-3 text-center">{{ service_type|title }} Request</h3>

<form method="POST" id="requestForm">
{% csrf_token %}

<div class="mb-3">
<label>Pickup Address</label>
{{ form.pickup_location }}
</div>

<div class="mb-3">
<label>Destination Address</label>
{{ form.destination }}
</div>

<div class="mb-3">
<label>Sender Phone</label>
{{ form.sender_phone_number }}
</div>

<div class="mb-3">
<label>Receiver Name</label>
{{ form.receiver_name }}
</div>

<div class="mb-3">
<label>Receiver Phone</label>
{{ form.receiver_phone_number}}
</div>

<div class="mb-3">
<label>Package Description</label>
{{ form.package_description }}
</div>

<div class="mb-3">
<label>Estimated Weight (kg)</label>
{{ form.weight }}
</div>

<!-- DISPLAY ONLY -->
<div class="mb-3">
<label>Distance (km)</label>
<input type="text" id="distance_display" class="form-control" readonly>
</div>

<div class="mb-3">
<label>Price (₦)</label>
<input type="text" id="price_display" class="form-control" readonly>
</div>

<!-- ✅ HIDDEN VALUES SENT TO DJANGO -->
<input type="hidden" name="distance" id="distance">
<input type="hidden" name="price" id="price">

<button type="button" class="btn btn-info w-100 mb-2" id="calculate-btn">
    Calculate Price
</button>

<button type="submit" class="btn btn-primary w-100">
    Submit Request
</button>

</form>

<a href="/" class="btn btn-secondary w-100 mt-3">Back Home</a>

</div>
</div>

<script>
let calculated = false;

document.getElementById("calculate-btn").addEventListener("click", function(){

    let pickup = document.getElementById("id_pickup_location").value;
    let destination = document.getElementById("id_destination").value;
    let weight = document.getElementById("id_weight").value || 0;
    let serviceType = "{{ service_type }}";

    if(pickup === "" || destination === "") {
        alert("Enter pickup and destination");
        return;
    }

    fetch(`/preview-price/?pickup=${encodeURIComponent(pickup)}
        &destination=${encodeURIComponent(destination)}
        &service_type=${serviceType}
        &weight=${weight}`)
    .then(response => response.json())
    .then(data => {
        if(data.error) {
            alert(data.error);
        } else {
            // DISPLAY
            document.getElementById("distance_display").value = data.distance.toFixed(2) + " km";
            document.getElementById("price_display").value = "₦ " + data.price.toFixed(2);

            // SEND TO BACKEND
            document.getElementById("distance").value = data.distance;
            document.getElementById("price").value = data.price;

            calculated = true;
        }
    })
    .catch(error => {
        console.log(error);
        alert("Error calculating price");
    });

});


// 🚨 PREVENT SUBMIT WITHOUT CALCULATING
document.getElementById("requestForm").addEventListener("submit", function(e){
    if(!calculated){
        e.preventDefault();
        alert("Please calculate price first before submitting.");
    }
});
</script>

</body>
</html>
