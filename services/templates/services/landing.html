{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ landing.title|default:"KHASIS EXPRESS" }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            color: white;
        }

        .center-box {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 10px;
            margin: 10px;
        }

        .brand {
            font-size: 40px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 18px;
            opacity: 0.9;
        }
    </style>
</head>

<body
{% if landing and landing.background_image %}
    style="background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('{{ landing.background_image.url }}'); background-size: cover; background-position: center;"
{% else %}
    style="background: linear-gradient(to right, #000000, #434343);"
{% endif %}
>

<div class="center-box">
    <div>

        <h1 class="brand">
            {{ landing.title|default:"KHASIS EXPRESS" }}
        </h1>

        <p class="subtitle">
            {{ landing.subtitle|default:"Swift, Reliable Delivery Across Lagos 🚚" }}
        </p>

        <div class="mt-4">
            <a href="/login/" class="btn btn-light">Login</a>
            <a href="/register/" class="btn btn-primary">Sign Up</a>
        </div>

    </div>
</div>

</body>
</html>
